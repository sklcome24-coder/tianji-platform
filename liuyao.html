<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>六爻禪解</title>
<style>
  :root{--bg:#F7F5F0;--fg:#2b2620;--dim:#7a7166;--line:#e2ddd3;--accent:#78350f}
  @media (prefers-color-scheme:dark){:root{--bg:#17150f;--fg:#ece7dd;--dim:#9c9385;--line:#332e25}}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:var(--bg);color:var(--fg);font-family:"Noto Serif TC",serif;padding:24px}
  .box{max-width:32rem;text-align:center;line-height:1.9}
  h1{font-size:1.25rem;margin:0 0 .25rem}
  .sub{font-size:.8rem;color:var(--dim);margin-bottom:1.75rem}
  .stat{font-size:.9rem;color:var(--dim)}
  .err{display:none;border:1px solid var(--line);border-radius:12px;padding:1rem 1.25rem;
        margin-top:1.25rem;font-size:.82rem;text-align:left;line-height:2}
  a{color:var(--accent)}
  .spin{display:inline-block;width:.8em;height:.8em;border:2px solid var(--line);
         border-top-color:var(--accent);border-radius:50%;animation:r .8s linear infinite;
         margin-right:.5em;vertical-align:-.05em}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="box">
  <h1>六爻禪解</h1>
  <div class="sub">六爻起卦・用神應期・禪解　｜　混元禪師 唯心聖教體系</div>
  <div class="stat" id="stat"><span class="spin"></span>正在尋找分析主機…</div>
  <div class="err" id="err">
    <b>目前連不上分析主機。</b><br>
    這一頁只是固定入口,實際的 app 跑在作者的機器上。<br>
    主機或隧道重啟時會有短暫空窗,稍候重新整理即可。
  </div>
</div>
<script>
/* 這一頁刻意不放 app 本身,只做轉址。
   理由:app 在作者機器上隨時會更新,Pages 若存一份副本就要跟著同步——
   而同步遲早會忘。2026-09-01 這個路徑上就躺過一支舊的 xuankong.html:
   沒有五黃順逆修正(替卦 14/216 盤會排錯,含光明頂七運辛山乙向),也沒有產生報告鈕,
   卻一直公開可達。轉址頁沒有副本,也就沒有版本落差——永遠是最新的那一份。
   本機開著時優先走 127.0.0.1,不繞外網。 */
(function(){
  var LOCAL='http://127.0.0.1:8765', ROUTE='/liuyao';
  var stat=document.getElementById('stat'), err=document.getElementById('err');
  function go(base){ location.replace(base+ROUTE); }
  function fail(){ stat.style.display='none'; err.style.display='block'; }
  function viaTunnel(){
    fetch('backend.json?t='+Date.now()).then(function(r){return r.json();})
      .then(function(j){ if(j&&j.api){ go(j.api); } else { fail(); } })
      .catch(fail);
  }
  var ac=('AbortController' in window)?new AbortController():null;
  var t=setTimeout(function(){ if(ac) ac.abort(); },1500);
  fetch(LOCAL+'/health', ac?{signal:ac.signal}:{})
    .then(function(r){return r.json();})
    .then(function(d){ clearTimeout(t); if(d&&d.ok){ go(LOCAL); } else { throw 0; } })
    .catch(function(){ clearTimeout(t); viaTunnel(); });
})();
</script>
</body>
</html>
