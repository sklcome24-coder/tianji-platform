/* 知識庫連線自動切換：本機 RAG 優先，連不上改走雲端隧道（讀 backend.json） */
(function(){
  var LOCAL = 'http://127.0.0.1:8765';
  var _fetch = window.fetch.bind(window);
  var base = LOCAL;
  /* HTTPS 頁面打 http://127.0.0.1 會被瀏覽器當混合內容擋掉：白等 1.5 秒、
     主控台留錯誤，本機捷徑一次也不會成立。GitHub Pages 就是 https。
     這一條紫微上架版早就有，雲端版一直沒有——2026-09-10 健檢比對三份產物時照出來。 */
  function fromConfig(done){
    _fetch('backend.json?t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(j){ if(j && j.api) base = j.api; done(); })
      .catch(function(){ done(); });
  }
  var ready = new Promise(function(done){
    if (location.protocol === 'https:') { fromConfig(done); return; }
    var ac = ('AbortController' in window) ? new AbortController() : null;
    var t = setTimeout(function(){ if(ac) ac.abort(); }, 1500);
    _fetch(LOCAL + '/health', ac ? {signal: ac.signal} : {})
      .then(function(r){ return r.json(); })
      .then(function(d){ clearTimeout(t); if(d && d.ok){ done(); } else { throw 0; } })
      .catch(function(){ clearTimeout(t); fromConfig(done); });
  });
  window.fetch = function(u, o){
    if (typeof u === 'string' && u.indexOf(LOCAL) === 0){
      return ready.then(function(){ return _fetch(base + u.slice(LOCAL.length), o); });
    }
    return _fetch(u, o);
  };
  /* 通行密語與 Gemini 金鑰分開存。
     後端 /gemini 驗的是密語，ziwei 的語音朗讀打 Google 用的才是金鑰；
     兩者原本擠在 localStorage['gemini_api_key'] 同一格，填哪個都會弄壞另一邊。 */
  var TOKEN_KEY = 'ni_access_token';
  try {
    /* 一次性設定連結 …#k=<密語>：存好就把片段從網址抹掉，不留在瀏覽紀錄裡。
       片段不會送到伺服器，也不會進 repo，手機端不必手打 24 個字。 */
    var m = location.hash.match(/[#&]k=([^&]+)/);
    if (m) {
      localStorage.setItem(TOKEN_KEY, decodeURIComponent(m[1]));
      history.replaceState(null, '', location.pathname + location.search);
    }
    /* 舊裝置這格存的是 Google 金鑰（AIza… / AQ.…），拿去當密語必被擋成 403。
       不刪掉——語音朗讀還要用——只是不再誤當密語。 */
    if (!localStorage.getItem(TOKEN_KEY)) {
      var legacy = localStorage.getItem('gemini_api_key') || '';
      if (legacy && !/^AIza/.test(legacy) && !/^AQ\./.test(legacy)) {
        localStorage.setItem(TOKEN_KEY, legacy);
      }
    }
  } catch (e) {}
  /* 頁面已經開著時點設定連結，瀏覽器只做同文件導覽、上面那段不會重跑。
     手機上這是常態（連結多半在已開的分頁裡打開），所以補這個。 */
  window.addEventListener('hashchange', function () {
    var mm = location.hash.match(/[#&]k=([^&]+)/);
    if (!mm) return;
    try {
      localStorage.setItem(TOKEN_KEY, decodeURIComponent(mm[1]));
      history.replaceState(null, '', location.pathname + location.search);
    } catch (e) {}
  });
  window.__NI_TOKEN__ = function () {
    try { return localStorage.getItem(TOKEN_KEY) || ''; } catch (e) { return ''; }
  };
  window.__NI_BACKEND_READY__ = ready.then(function(){ return base; });
})();
</script>

// --- 0. IndexedDB 圖片固化模組 ---
const DB_NAME = "TianJi_Assets_DB";
const DB_VERSION = 1;
const STORE_NAME = "hexagram_images";
class ImageDB {
  static async open() {
    return new Promise((resolve, reject) => {
      const request = indexedDB.open(DB_NAME, DB_VERSION);
      request.onupgradeneeded = event => {
        const db = event.target.result;
        if (!db.objectStoreNames.contains(STORE_NAME)) {
          db.createObjectStore(STORE_NAME, {
            keyPath: "id"
          });
        }
      };
      request.onsuccess = event => resolve(event.target.result);
      request.onerror = event => reject(event.target.error);
    });
  }
  static async saveImage(id, fileBlob) {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      const store = tx.objectStore(STORE_NAME);
      // 儲存 ID 與 Blob 二進位資料
      const request = store.put({
        id: parseInt(id),
        blob: fileBlob,
        timestamp: Date.now()
      });
      request.onsuccess = () => resolve(true);
      request.onerror = () => reject(false);
    });
  }
  static async getAllImages() {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readonly");
      const store = tx.objectStore(STORE_NAME);
      const request = store.getAll();
      request.onsuccess = () => {
        const results = {};
        request.result.forEach(item => {
          // 將 Blob 轉回 URL 供 img 標籤使用
          results[item.id] = URL.createObjectURL(item.blob);
        });
        resolve(results);
      };
      request.onerror = () => reject({});
    });
  }
  static async clearAll() {
    const db = await this.open();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NAME, "readwrite");
      const store = tx.objectStore(STORE_NAME);
      const request = store.clear();
      request.onsuccess = () => resolve(true);
      request.onerror = () => reject(false);
    });
  }
}

const pcmToWav = (base64PCM, sampleRate = 24000) => {
  const binaryString = atob(base64PCM);
  const len = binaryString.length;
  const buffer = new ArrayBuffer(44 + len);
  const view = new DataView(buffer);
  const writeString = (view, offset, string) => {
    for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i));
  };
  writeString(view, 0, 'RIFF');
  view.setUint32(4, 36 + len, true);
  writeString(view, 8, 'WAVE');
  writeString(view, 12, 'fmt ');
  view.setUint32(16, 16, true);
  view.setUint16(20, 1, true);
  view.setUint16(22, 1, true);
  view.setUint32(24, sampleRate, true);
  view.setUint32(28, sampleRate * 2, true);
  view.setUint16(32, 2, true);
  view.setUint16(34, 16, true);
  writeString(view, 36, 'data');
  view.setUint32(40, len, true);
  for (let i = 0; i < len; i++) view.setUint8(44 + i, binaryString.charCodeAt(i));
  return buffer;
};

// --- 防 429 錯誤的重試機制 ---
// 只對「伺服器明說稍後再試」的狀態重試。
// 網路中斷與逾時一律不重試 —— 2026-08-18 的教訓：判讀跑 156 秒、
// 隧道 100 秒就閒置切斷，前端把它當成可重試的失敗，一題連燒五輪完整生成、
// 一個字都拿不到。重試只有在「同樣的請求下次可能成功」時才有意義。
// 429 不在重試名單：後端的 429 代表額度用罄／期限到期，重試一百次也不會過。
// （2026-08-28 上架版已修，免費版漏掉，2026-09-10 由 test_drift.py 抓出。）
const RETRYABLE = [500, 502, 503, 529];
const fetchWithRetry = async (url, options, maxRetries = 2) => {
  let retries = 0;
  while (true) {
    try {
      const response = await fetch(url, options);
      if (!response.ok) {
        const err = new Error(`API Error: ${response.status}`);
        err.status = response.status;
        // 伺服器把真正的原因寫在 body 裡（Gemini 形狀的 JSON）。
        // 不讀出來，就等於把具體原因換成一句沒有意義的通則訊息。
        // 就地取，不呼叫下面那個 partsText——它宣告在更內層的作用域，
        // 在這裡是取不到的（2026-09-10 差點寫成那樣）。
        try {
          const parts = JSON.parse(await response.text())?.candidates?.[0]?.content?.parts;
          err.serverMessage = Array.isArray(parts) ? parts.filter(x => x && typeof x.text === "string" && !x.thought).map(x => x.text).join("") : "";
        } catch (e) {/* body 不是預期格式就算了 */}
        throw err;
      }
      return response;
    } catch (error) {
      if (error.name === 'AbortError') throw error;

      // 403：後端要密語。這是設定問題，重試一百次也不會過，
      // 而且原本只顯示「API Error: 403」，看的人無從知道要做什麼。
      if (error.status === 403) {
        throw new Error("【需要通行密語】請點右上角「設定」，把密語填進「通行密語」欄位。" + "密語在 Mac 終端機執行 cat ~/.rag_token 取得；每台裝置各填一次。");
      }
      // 網路層失敗（連線被切、逾時）沒有 status —— 不重試。
      if (!error.status || !RETRYABLE.includes(error.status) || retries >= maxRetries) {
        if (error.status === 429) {
          // 不要編造等待時間——伺服器沒說要等多久，我們也不知道。
          throw new Error(error.serverMessage || "【額度已滿】知識庫目前無法回應（HTTP 429）。這通常是當日用量已滿，稍後再試。");
        }
        if (!error.status) {
          throw new Error("【連線失敗或逾時】後端沒有在時限內回應。" + "若是用手機連家中 Mac，隧道約 100 秒會閒置切斷；請改用電腦，或縮短提問。");
        }
        throw error;
      }
      const delay = Math.pow(2, retries) * 1000;
      await new Promise(resolve => setTimeout(resolve, delay));
      retries++;
    }
