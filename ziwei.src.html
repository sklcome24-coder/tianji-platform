(function(){
  var LOCAL = 'http://127.0.0.1:8765';
  var _fetch = window.fetch.bind(window);
  var base = LOCAL;
  var ready = new Promise(function(done){
    var ac = ('AbortController' in window) ? new AbortController() : null;
    var t = setTimeout(function(){ if(ac) ac.abort(); }, 1500);
    _fetch(LOCAL + '/health', ac ? {signal: ac.signal} : {})
      .then(function(r){ return r.json(); })
      .then(function(d){ clearTimeout(t); if(d && d.ok){ done(); } else { throw 0; } })
      .catch(function(){
        clearTimeout(t);
        _fetch('backend.json?t=' + Date.now())
          .then(function(r){ return r.json(); })
          .then(function(j){ if(j && j.api) base = j.api; done(); })
          .catch(function(){ done(); });
      });
  });
  window.fetch = function(u, o){
    if (typeof u === 'string' && u.indexOf(LOCAL) === 0){
      return ready.then(function(){ return _fetch(base + u.slice(LOCAL.length), o); });
    }
    return _fetch(u, o);
  };
  window.__NI_BACKEND_READY__ = ready.then(function(){ return base; });
})();
</script>

        // --- 0. IndexedDB 圖片固化模組 ---
        const DB_NAME = "TianJi_Assets_DB";
        const DB_VERSION = 1;
        const STORE_NAME = "hexagram_images";

        class ImageDB {
            static async open() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open(DB_NAME, DB_VERSION);
                    request.onupgradeneeded = (event) => {
                        const db = event.target.result;
                        if (!db.objectStoreNames.contains(STORE_NAME)) {
                            db.createObjectStore(STORE_NAME, { keyPath: "id" });
                        }
                    };
                    request.onsuccess = (event) => resolve(event.target.result);
                    request.onerror = (event) => reject(event.target.error);
                });
            }

            static async saveImage(id, fileBlob) {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, "readwrite");
                    const store = tx.objectStore(STORE_NAME);
                    // 儲存 ID 與 Blob 二進位資料
                    const request = store.put({ id: parseInt(id), blob: fileBlob, timestamp: Date.now() });
                    request.onsuccess = () => resolve(true);
                    request.onerror = () => reject(false);
                });
            }

            static async getAllImages() {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, "readonly");
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.getAll();
                    request.onsuccess = () => {
                        const results = {};
                        request.result.forEach(item => {
                            // 將 Blob 轉回 URL 供 img 標籤使用
                            results[item.id] = URL.createObjectURL(item.blob);
                        });
                        resolve(results);
                    };
                    request.onerror = () => reject({});
                });
            }
            
            static async clearAll() {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction(STORE_NAME, "readwrite");
                    const store = tx.objectStore(STORE_NAME);
                    const request = store.clear();
                    request.onsuccess = () => resolve(true);
                    request.onerror = () => reject(false);
                });
            }
        }

        // 【核心修正】完整載入天紀 64 卦梅易讀圖口訣庫
        const TIAN_JI_FULL_TEXT = {
            "乾為天": "一、官人在梯上：平步青雲象。\n二、鹿在雲中：作為行事心中不可求禄，則祿至矣。\n三、石上玉有光明：示人才如玉之含光，吉也。\n四、人磨玉：示人堅心不移，夕惕若厲，随時戒之。\n五、工匠：有重立門户之象。\n六、梯上官人：棺也。卜疾厄凶也。\n七、官人望磨玉人：示人即平步青雲須戒盛，且望下看，念中無妄，則升選平安，如爭位則旦夕而亡也。",
            "坤為地": "一、十一口：吉也，陳姓人也。\n二、一官人：信人，丈夫也。公務員也。\n三、坐看二串錢：欲拿不得，憂心忡忡狀。\n四、一馬者：肖馬人；指官貴；指調動也。\n五、金甲神：示民心也。\n六、授文書與官：授官封侯。\n七、土堆上有四點：黑也，背有陰謀也。",
            "水雷屯": "一、人在望竿頭上文：此不明局勢之屯難時也，不可妄動也。\n二、犬上回字：乃肖狗之人，狗年，狄姓之人，果為哭之象。\n三、車在泥中：進退兩難之象。刀在牛上：解也，牛為貴人象。\n四、人射文害：張姓，小人阻礙也、射：同音，色也，緋聞。\n五、牛不順道：悖道而馳，反其道而為之，吉。\n六、人望：人亡也。\n七、人立：在位也。\n八、盒：先成後破。\n九、牛回頭視犬：計無所出，待也。",
            "山水蒙": "一、滿船珍寶：暗示人圖財之象。\n二、船在水上：乃離國他去象。\n三、鹿在地上，示仍有小祿於內，鹿一祿也。\n四、兩串錢：乃憂心忡忡象，即意雖有祿，但仍令人憂心。\n五、圖中一碗：示此蒙蔽手段，必先成後破，因其乃不正之財，必不久遠也。\n六、李樹子折：示人李姓人氏，且有子夭折之象，則成格。",
            "水天需": "一、月當天：陰人居上位象，無擔當也；清明無災。\n二、一門：豪門也，官府也。\n三、一人攀龍尾：附於貴人，想進據其位也。\n四、一僧接引：光頭之人，柔而無慾之象。入空門可解。\n五、墓：藏棺之地，有官與財象；置之死地而後生之象。",
            "天水訟": "一、口舌二字：官司，糾紛，災也。\n二、山下有睡虎：入危地而不知象。\n三、虎：王姓，肖虎之人。\n四、文書在雲中：心想事不成，幻想也。\n五、人立虎下：近險也，近險為脱險之道。\n六、柳樹：隨風而動，雖大風而不斷，此柳之性也。",
            "地水師": "一、肖虎、馬、羊之人三合：可戰。\n二、文武二官綬印：得萬人服之帥。\n三、人立棋盤上：圍棋愈下愈多，但須有謀略方可成事。\n四、將軍臺上立：示有兵權也。生殺之專權也。武職大利。\n五、羊回首：回陽也，病危之人卜之，有自陰間回陽間之象。\n六、虎在馬後：為馬之靠山，馬因虎威而動。故馬回首視虎。",
            "水地比": "一、月圓當空：政治清明象。\n二、三星拱照：得賢能剛直之人輔助。\n三、秀才望月飲酒：示才智之人無憂也。\n四、自酌自斟：無慾則剛象，孤獨之象。\n五、藥爐在高處：無病無災，故不需用藥也。\n六、枯樹開花：晚發也。示心有誠，制度立，事必成。\n七、酒：忘憂之物。",
            "風天小畜": "一、兩重山：知有險阻於前，不妄動之象。亦為出字象。\n二、一人山頂：孤立獨行象。已至顛峰，將走下坡之意。\n三、舟橫岸上：準備出發，水未至而不行也。\n四、望竿在草裡：等待訊息象。草頭姓人為貴人。望，亡也。\n五、上有羊馬：馬引羊過河，馬為貴人，肖馬人，姓馬人也，馬亦為午時。",
            "天澤履": "一、女人在笠下：妾也。\n二、千里堠：遠離外出封侯象。\n三、文書破在地：憑證承諾無效象。\n四、傘下：有庇蔭也。\n五、軍旗下官人坐：主有官司、訴訟、牢獄之災象。\n六、二點在地：踐踏之足印也，示人處危之時，有禮之道，乃能行危而無殃也。",
            "地天泰": "一、月中桂開：清明政治之時。\n二、官人登梯：升遷順遂之意，官人亦倌人，即丈夫也。\n三、鹿銜書：受天子恩賜祿位。\n四、小兒在雲中：少年得志象。得天官貴人助也。\n五、羊回頭：回陽間也。亦楊姓人，發肖羊人成格。",
            "天地否": "一、男子臥病：男子為陽，陽同伴，裝病之象也。\n二、镜破：不可赴也。破鏡難圓之象。\n三、人路上坐：小人阻路，不讓進也。\n四、張弓箭頭落地：鳥盡弓藏也。\n五、人拍掌笑：幸災樂禍之小人，做假攻評兩人感情得逞狀，夫妻凶。\n六、舌：主口舌，官司，謠言生害。\n七、口上有四點：四點為黑，暗中誣陷之謠言，古人謂三口成虎，即意此。",
            "天火同人": "一、人捧文書上有心字：得民心之象，同心協力之象。寧姓。\n二、人張弓射山上：高中金榜。張姓人氏。\n三、一鹿飲水：财祿滾滾而來。亦在野之賢人。\n四、一溪：平和安靜狀。\n五、鹿之性，動則敏，靜則順，此剛健人之性，世間但聞虎食人，未聞鹿食人。",
            "火天大有": "一、婦人腹中一道氣：妊娠之事；事萌於內也。\n二、氣中二子：主雙喜臨門。伯仲之間象。\n三、一藥王：平安之象。得病有救，遇良醫也。\n四、藥有光：藥有名也，災中有救也。\n五、女人受樂：女人為陰，示表面不信，但暗中仍聽之。\n六、一犬：乃狗年，戌月，戌日，此論時機也；或狄姓人士。\n七、犬：哭笑皆有象。",
            "地山謙": "一、月當天：清明之政，中秋時也。\n二、一人骑鹿：才祿俱備。\n三、三人腳下亂絲，隱於山後：小人不敢正面示人，惟隱山謙之後（即外飾謙為幌子）實則亂如麻，計無所出。\n四、貴人捧鏡：明鏡高懸，執法公正光大。\n五、文字上有公字：處事以公，得理也。",
            "雷地豫": "一、兩重山：出象，千里阻隔也。\n二、官人在中：外出不任官象；丈夫外出從商。\n三、一祿一馬：從商之人，財祿豐盛。\n四、金銀數錠：紙錢錠，主喪服。\n五、錢一堆者：內有憂心忡忡象。",
            "澤雷隨": "一、雲中雁傳書：飛來喜訊象。\n二、一堆錢：財聚也。\n三、朱門内有人坐：君王之象，必見君面也。\n四、一人在門外立地：乃士人求仕，受尊重之象。\n五、串錢在地：有財利不行之象。\n六、亂珠聚盆：先聚後散之象。",
            "山風蠱": "一、孩兒在雲中：有天官促成也。不求名利之人。\n二、雁啣書：有消息至。\n三、一鹿：有大利也。\n四、錢在空中：此心中圖利之象也。\n五、男女相拜：男女相合，此為利而結合，非正婚也。",
            "地澤臨": "一、婦人乘風：外援為陰女，美人也。\n二、一車上有使旗：出使之象，以謀略可解災，謀之對象為女人也。連姓、車姓人。\n三、人在山頂頭：盛極將衰，招困也，即將下坡也。\n四、虎在山下坐：人受虎困之象。\n五、一盒：先成後破象。\n六、人射弓：張姓人士，夷狄之人，以弓射獵，故外族入侵象。",
            "風地觀": "一、日月當天：政治清明，普照大地，父母雙全。\n二、官人香案邊立：信人，丈夫也。蔡姓人士，神人共明之象。\n三、鹿在山上：得高祿之象。\n四、金甲人：君側之人也，護衛也。\n五、執印秤：提印信而來授權也。",
            "火雷噬嗑": "一、北斗星：君王也，夫君也，公職也。\n二、婦人燒香拜：妻於人事無助，乃求助於天。\n三、憂字不全喜字全：乃無憂有喜象。\n四、一雞食稻：果被食，無果也。\n五、一錢財、一鹿者：於財祿事憂心忡忡也。\n六、离：字解為「離多會少」之象。",
            "山火賁": "一、雨下：滿也，潤澤也，成也。\n二、車行路：前往任官象，行走四方也。\n三、舟張帆在江中：此行順風大利也。\n四、官人著公服登梯：升遷在外地象。任公職主官外調象。丈夫從公職升官也。\n五、仙女雲中執珪：受陰人提攜象。",
            "山地剝": "一、婦人床上坐：必有暗災，陰人得勢，陽道衰弱，小人為主官。\n二、燭在風中：險也。\n三、葫蘆：醫藥無救也；有暗計也。\n四、繅絲：事務繁冗。\n五、山下官人坐：有靠山，但陰人為禍。\n六、冠巾掛木上：求去之象；又有樂之象。",
            "地雷復": "一、官人乘車：使節也；車姓、連姓也：軍隊也；官大也；調職也。\n二、車上兩隻旗：將、帥也；一方之主也。\n三、堠上東字：猴發木形人。東：有心約東，十八日至。十日來人封侯象。\n四、一將持刀立：武威之人，司法執行人。\n五、一兔：肖兔之人，劉姓之人。\n六、一虎：肖虎之人，王姓之人。",
            "天雷无妄": "一、官人射鹿：自亂陣腳。\n二、鹿啣文書：財訊至也。\n三、錢一堆在水中：得財遇險之象。險中求財，憂心忡仲也。\n四、一鼠一豬：遇子、亥年吉，肖鼠人陰謀，肖豬人黑心。",
            "山天大畜": "一、一鹿一馬：祿馬交馳，大富之象。\n二、月下有文書：明而有往，中秋時節，文書在空中尚末到手。\n三、官人憑欄：無事狀，遥望所失之國度。又欄為木，人靠木，休也。棺也。\n四、花在盆中：有限也。",
            "山雷頤": "一、雨下：受恩澤也。\n二、三小兒：乃合心之象，有德之國也。\n三、日當天：君明之象。父全。\n四、香案：求取之象。\n五、金紫官人：天子身側之人。\n六、引一人：提攜，推薦也。",
            "澤風大過": "一、官人乘車上插兩旗：車至官來，必有官司訴訟，軍人象。\n二、旗上有喜字且分開，乃喜有破損象，捨去婚姻象。\n三、入朱門：乃豪門世家相請，或朱姓人。\n四、門外貴人立：被棄於外象。\n五、文書在地：合約，契約，不成之象。\n六、一合子：先成後破之象。",
            "坎為水": "一、人在井中：官司，牢獄，陷入險地象。\n二、人用繩引出：貴人出手相救狀。\n三、一牛：勞苦也，春夏凶，秋冬吉，亦肖牛人。\n四、一鼠：肖鼠人，陰謀暗害者，暗藏也。\n五、人身虎頭：有權威之人，貴人也。",
            "離為火": "一、人在虎背上立：行危不懼；難下也。\n二、一船在江心：口舌相爭，無所適從也。\n三、官人執箭岸上立：在位之人，欲殺之象。",
            "澤山咸": "一、空中有一拳：貴人提拔，憑空而得。\n二、錢寶一堆：求財得財。\n三、貴人在山頂：孤立狀，即將下坡，退休狀。\n四、女人上山：夫妻吉，陰人卜之知走馬上任。\n五、合子：先成後破，因誠感方吉，物感必凶。",
            "雷風恆": "一、日在雲中：昏暗之象，君主不明象。\n二、鳳啣書：喜訊至，金榜题名也。\n三、官人行路：將至也，貴人至。官人，倌人，丈夫也，人傍為信也。\n四、道士手指門：入空門也，閃也。\n五、鼠下兩口：陰謀在後之象；兩口，回也，呂姓也。\n六、時機：在春末，日為春之末尾也。",
            "天山遯": "一、一山：阻也。\n二、一水：險也。\n三、酒旗上文字：酒為忘憂之物，文在旗上，受人提攜也。\n四、官人踏龜：歸，鬼也；玄武自來，水上求財。\n五、幞頭上樹：求去辭官也。\n六、月在雲中：主半清半濁象，事未明晰。\n七、人在水邊：等待平安狀，蒞臨也。\n八、樹下人獨酌：休也，無事也，萌生退意狀。",
            "雷天大壯": "一、北斗星：帝君，老闆，主事之人。\n二、天神執劍：民意歸向，人心也。\n三、一官人燒香拜：拜求於天，而不求人，凶。\n四、一猴、一兔、一犬：侯，劉，狄姓，在野之人。\n五、猴回頭：回吼。\n六、兔回頭：回吐。\n七、羊回頭：回陽。",
            "火地晉": "一、文字破：官事不成，退位象。\n二、官人掩面：無顏見人，悲象。\n三、毬在泥上：所求必陷險也。\n四、雞啄料：雞，酉也，肖雞人也，落日之象。秤：示公平，稱心也。\n五、枯木生花：晚發也。\n六、鹿啣書：禄與命到也。\n七、一堆金寶：財祿豐收之象，占疾病，則有燒金紙之象。主喪服，三人去一也。\n八、人立水邊：忍泣之象，主喪服。\n九、三點在石上：心象，示人心在石上，不動念，堅心也。",
            "地火明夷": "一、婦人在井中：女人招災，或頭部災，察内有災。\n二、虎在外：外人虎視眈眈。\n三、錢缺：財傷也。\n四、人逐鹿：財失也，爭相為祿，逐鹿中原。\n五、堠在人鹿中：猴作梗也。\n六、斧：斧也，工匠獨有，匠，將也，武官人。\n七、堠：不動也，尊位也，姓侯，肖猴。\n八、鹿回頭：回祿也，火災。\n九、人手上木技：休象。",
            "風火家人": "一、一人張弓：暗算，破壞也。\n二、一帶在水邊：事滯也，棄官也。\n三、雲中文書：突而來之喜訊也。\n四、貴人拜受：綬命也。\n五、婦人攜手：家和之象，此卦卜婚姻大吉。",
            "火澤睽": "一、人執斧在手：求快也，行刑之人，執法之人，有權柄也。\n二、文書半破：無望象，毁約也。\n三、牛鼠：秋冬吉，春夏凶。\n四、桃開：逃開也。\n五、門掩：牢獄之災，閉也，隔也。\n六、雁飛鳴：悲也，孤單也，報凶訊也。",
            "水山蹇": "一、日當天：君明之象，吳姓。\n二、旗一面只有使字：出使，和平之象，使一二人一口，示單人也。\n三、鼓五面者：時為五更天，佔五面地，王為君王，一方之主，有多國或多島之象。\n四、中有一鹿：攜財福至，旅客帶財來狀，商人至也。\n五、堆子千里字：行西南，千里封候，侯姓也。\n六、千里為重：有第二次方吉。",
            "雷水解": "一、旗上提字：指名提凶，不利。有遠走他鄉之象。\n二、一刀插地：求快也，劉姓之人也。\n三、一兔走：卯年，劉姓。\n四、一雞在邊鳴：有競爭象，酉年適逢貴人救。\n五、貴人雲中：不及救也。\n六、道士手指門：入空門也，逃亡方向，出家也。\n七、道人獻書：裝飾外表，示誠象。",
            "山澤損": "一、二人對酌：二人夾木，來也。\n二、酒瓶倒案之：目前無指望也。\n三、毬在地上：所求不成狀。\n四、文書二策有再告二字：再次求，方成。",
            "風雷益": "一、官人抱合子：信人，丈夫也，事必先成後破。\n二、一人推車：因時而動之象，空坐相請。\n三、一鹿一錢：才祿俱備，有回祿之災，財有破損，憂心忡忡。\n四、不為財貨，不畏時尚之變，明知先成後破，仍走馬上任，以損上益下之道，天下或事業亦能平治。",
            "澤天夬": "一、二人同行：相輔相成，可成事也。\n二、前水後火：前險而後明，宜進取象，土生金象。\n三、虎蛇當道：虎，有權威之人。蛇一險奸之小人阻道。\n四、一人斬蛇：勇士也，得名將也。\n五、竿上有文字：揚竿而起，正名出師。\n六、竿下有錢：行動有利也。\n七、錢下有火：燒錢狀，主喪服。",
            "天風姤": "一、官人射鹿：丈夫也，取祿狀，野外之財，射，發也。\n二、文書上有喜字：摇摇欲墜，根只一線，夫妻凶。\n三、二人執索：互相牽扯。\n四、綠衣人指路：掌生死簿之人，信差（今日）。\n五、二重山：重阻也。出也。",
            "澤地萃": "一、貴人磨玉：進修也，專心一致也，免破損也。\n二、一僧指：指引也，局外人也，光頭人也，曾姓人也。\n三、小兒山路：退引山林，以退為進象，示上坡也。倪姓。\n四、一人救火：救災禍也；猶行醫濟世救人之道也。\n五、一魚在火上：得救狀，或餐飲業。\n六、一鳳啣書：喜訊至也。",
            "地風升": "一、雲中雨點下：沾衣恩澤之象，昏暗之時將過也。\n二、木匠下墨解木：有尺度法則，有依據之象。匠一將也。以武力去災也有改朝換代之象也。\n三、一人磨鏡：可成始得之象。\n四、一架子負大木：有不小之財也。\n五、有鏡：指明鏡高懸，於商事指有競爭也。\n六、藍：雞也，百廢待舉之象。",
            "澤水困": "一、一輪獨在地下：獨行也無依也，方向不明也。\n二、一人臥病，招危難也。\n三、藥爐：有人來救，待時緩進也。\n四、貴人傾水救旱池魚：旱池，無財也，有貴人資援。\n五、池中青草：仍有生氣狀。",
            "水風井": "一、金甲神執符：貴人在空中，祥瑞之兆也。\n二、女子抱合：好也，但先成後破。\n三、錢寶有光起：財不失，不能之象，不久有喪也。\n四、人落井中：病重象，官司沈陷象，招陷害也。\n五、官人用繩引出：貴人為官人，欲相救也。\n六、符：符乃策略有傍人作對。",
            "澤火革": "一、一人把柿全，乃人肺腑之言。\n二、一人把柿不全，一人半真言也。\n三、一兔：羅進之象。\n四、一虎：威權之象，大人之象，肖虎也。\n五、官人推車有一印：如為武官，則訟至。今為文官帶印，主得掛印封帥，須力求變革，果必成，丈夫推車，乃求婚也，帶印必成。\n六、虎兔向山行：賢良大人退，後繼有人羅進同行。\n七、山頭四點：上位之人，黑暗不明之象。\n八、大路：轉變為新且順之象。",
            "火風鼎": "一、雲中月現：顯象，撥雲見月之象，清明也。\n二、鵲南飛：冬至來臨，北人執政。\n三、一子裹席帽，不明之人，無知之人。果喜也。\n四、一人執刀：武官也，護衛將軍。\n五、貴人端坐無畏：君王，老闆等人，至公無私。\n六、一鼠：子年，暗謀之人，內有陰謀，肖鼠人也。",
            "震為雷": "一、人立岩上：特立獨行，摇摇欲墜也。危險也。\n二、一樹開花：有果也，惜乎過於短暫，少部份之人。\n三、一文書：消息至，公文至。\n四、一人推車：轉變之象，執行命令象。\n五、上有文字：得官令也。\n六、一堆錢財者：錢財散於地狀，憂心也，喪事也，求財不利，占疾病凶。",
            "艮為山": "一、堠上東北字：候也，停滯等候也，陳姓。\n二、猴執文書：候其時，待公文命令至也。\n三、官吏執鏡：清明之法官，政治清明。\n四、三人繩相繫縛：三人相牽連招訟事也。",
            "風山漸": "一、一望竿在最高處：家人望歸象。\n二、一藥爐在地：平安，無災也。\n三、一官人登梯：升官之象，衣錦還鄉也，棺也。\n四、一枝花在地：落第象，不久之象。",
            "雷澤歸妹": "一、官人騎鹿指雲：浮雲蔽日，乘亂而欲進。\n二、小鹿子在後：生意人，隨從狀。\n三、望竿上有文字：旦夕而亡，揭竿而起，正名也。\n四、人落刺中：如鲠在喉，去之不得。\n五、一人拔出：一人相救示寵狀。\n六、此卦問病凶，問財吉，問政凶。",
            "雷火豐": "一、竹简灰起：簡姓，竹有順象，堅節不變之象，灰起，中空之象。\n二、龍蛇交錯：辰已之年，正邪相爭，蛇虺乃陰謀暗算也。\n三、官人著衣袋立：官人、信人、丈夫也，歡於内也。\n四、一合子：先成後破。\n五、人吹笙竿：閒情逸志，主喜事臨門。\n六、腳踏虎：臨危不亂也，險在下也。\n七、阜沼之旁：心力交瘁也。\n八、池中無水：旱象，破財也。\n九、珠溶盤中：先聚後散也。",
            "火山旅": "一、三星者：三台貴人，相位之人。\n二、貴人台上垂釣：君主相求，老闆相求人才。\n三、牽水畔人：賢能之人，離野入朝封候。或慕權勢而變志。\n四、一猴一羊：肖猴，肖羊，候、楊姓人，未申年應之。\n五、大溪：脱險也，港口也，水側也。",
            "巽為風": "一、貴人賜衣：先破後成象。\n二、一人跪受：貴綬也。如占疾病，則主壽衣，凶象。\n三、雲中雁傳書：意外喜訊。\n四、人在虎下坐：身處險而不知。\n五、一人射虎中箭：貴人相救。\n六、虎走：脱險，寅年也。",
            "兌為澤": "一、人坐看一擔：任務完成狀，有人相助象，助人為樂之貴人。\n二、月在天邊：清明之治。\n三、秀才登梯：金榜登科象。\n四、一女在合邊立：女人介入，先成後破。\n五、文字上箭：得機而發，射：發象。",
            "風水渙": "一、山上有寺：出家狀，對峙狀，寸土寸金象。\n二、僧：化外之人，光頭人，曾姓人。\n三、一人随後：逃避，求助化外之人。\n四、一鬼在後：為禍追緝之象，内心有鬼，處事不明象。\n五、金甲人：正義之師，得民心也。\n六、寺，土頭人作對。等待時機也。",
            "水澤節": "一、大雨下：陰暗不明，凶象。\n二、火中魚躍：飛騰而徒勞無功，又餐飲業。\n三、雞在屋上：酉年肖雞人，解救之時與人。\n四、大在井中：招陷，動彈不得，不知節制而招如此。\n五、屋門開著：仍可開張，须雞人來助大吉。",
            "風澤中孚": "一、望子上文書：科甲高中，刑法更吉。\n二、人擊柝：預警也。\n三、貴人用繩牽鹿：守成，不可攻也。\n四、雁啣書：喜事將至，有南徒之象。\n五、人立庭中：蒞庭也，防官司或打官司保身也。",
            "雷山小過": "一、明月當空：政清狀，入法庭，刑堂。\n二、林下一人：林姓人。\n三、人陷網中：不得脱身，受束縛。\n四、一人彈冠：求去之象，但求去為形，束縛為神，合則有表裡不一狀。\n五、一人割網：貴人解救，脱困狀。\n六、猴子在山頭：從新開始之象（候再出山）。",
            "水火既濟": "一、人在岸上：泣也，等待也，無目的也。\n二、一船來：接引至也。\n三、一堆錢：財祿無用也，憂心忡忡也，有竊象，抄家之象。\n四、雲中雨下：陰中有果也，夜間至凌晨時。\n五、二小兒：主喜也，二人也，二人雨中行也。\n六、文書一策：證件，命令也，資料也。",
            "火水未濟": "一、一人提刀斧：劉姓，武官，手有生殺之權。\n二、一虎坐：肖虎人，王姓，虎坐乃無威之象。\n三、一旗卓在山上：揭竿而起，正義之師。\n四、一人取旗：代替也，高姓，未姓，其人取代之象。\n五、梯子有至字：無刀日至，桎桔受困象。\n六、（附註：峪：谷姓。旗揚：楊姓。）有谷、楊合乃招凶象。"
        };

        const pcmToWav = (base64PCM, sampleRate = 24000) => {
            const binaryString = atob(base64PCM); const len = binaryString.length; const buffer = new ArrayBuffer(44 + len); const view = new DataView(buffer);
            const writeString = (view, offset, string) => { for (let i = 0; i < string.length; i++) view.setUint8(offset + i, string.charCodeAt(i)); };
            writeString(view, 0, 'RIFF'); view.setUint32(4, 36 + len, true); writeString(view, 8, 'WAVE'); writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true); view.setUint16(20, 1, true); view.setUint16(22, 1, true); view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true); view.setUint16(32, 2, true); view.setUint16(34, 16, true); writeString(view, 36, 'data');
            view.setUint32(40, len, true); for (let i = 0; i < len; i++) view.setUint8(44 + i, binaryString.charCodeAt(i)); return buffer;
        };

        const getZhiIndexFromHour = (hour) => (typeof hour !== 'number' || isNaN(hour)) ? 0 : (hour >= 23 || hour < 1) ? 0 : Math.floor((hour + 1) / 2);
        const getYinPalaceGanIndex = (yearGanIdx) => (2 + (yearGanIdx % 5) * 2) % 10;
        const getBureau = (mingGanIdx, mingZhiIdx) => {
            let cycleIndex = -1;
            for (let i = 0; i < 60; i++) { if ((i % 10) === mingGanIdx && (i % 12) === mingZhiIdx) { cycleIndex = i; break; } }
            return cycleIndex !== -1 ? NA_YIN_ELEMENTS[cycleIndex] : 2; 
        };
        const getZiweiPos = (bureau, day) => { let X = (day % bureau === 0) ? 0 : bureau - (day % bureau); let Q = (day + X) / bureau; let posIndex = (2 + Q - 1) % 12; if (X === 0) return posIndex; return (X % 2 !== 0) ? (posIndex - X + 12) % 12 : (posIndex + X) % 12; };
        const getTianfuPos = (zwPos) => { const map = { 0: 4, 1: 3, 2: 2, 3: 1, 4: 0, 5: 11, 6: 10, 7: 9, 8: 8, 9: 7, 10: 6, 11: 5 }; return map[zwPos]; };
        const getRelatedPalaces = (index) => [index, (index + 6) % 12, (index + 4) % 12, (index + 8) % 12];

        const TRIGRAM_LINES = { 1:[1,1,1], 2:[1,1,0], 3:[1,0,1], 4:[1,0,0], 5:[0,1,1], 6:[0,1,0], 7:[0,0,1], 8:[0,0,0] }; // 爻由下而上，1陽0陰
        const TRIGRAM_NAME = { 1:'乾', 2:'兌', 3:'離', 4:'震', 5:'巽', 6:'坎', 7:'艮', 8:'坤' };
        const TRIGRAM_ELEMENT = { 1:'金', 2:'金', 3:'火', 4:'木', 5:'木', 6:'水', 7:'土', 8:'土' };
        // HEX_MATRIX[上卦-1][下卦-1] = 周易卦序
        const HEX_MATRIX = [

        const linesToTrigram = (l) => { for (let t = 1; t <= 8; t++) { const L = TRIGRAM_LINES[t]; if (L[0] === l[0] && L[1] === l[1] && L[2] === l[2]) return t; } return 8; };
        const hexFromTrigrams = (upper, lower) => { const id = HEX_MATRIX[upper - 1][lower - 1]; return { upper, lower, id, name: HEXAGRAM_NAMES[id] }; };
        const WU_XING_SHENG = { '金': '水', '水': '木', '木': '火', '火': '土', '土': '金' };
        const WU_XING_KE = { '金': '木', '木': '土', '土': '水', '水': '火', '火': '金' };
        const tiYongJudge = (ti, yong) => {
            if (ti === yong) return '體用比和，謀事順遂，吉。';

            return '用剋體，事難成且防損傷破財，凶。';
        };

        // --- 防 429 錯誤的重試機制 ---
        const fetchWithRetry = async (url, options, maxRetries = 5) => {
            let retries = 0;
            while (retries <= maxRetries) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        const err = new Error(`API Error: ${response.status}`);
                        err.status = response.status;
                        throw err;
                    }
                    return response;
                } catch (error) {
                    if (error.name === 'AbortError') throw error;
                    if (error.status && [400, 403, 404].includes(error.status)) throw error;
                    
                    if (retries >= maxRetries) {
                        if (error.status === 429) {
                            throw new Error("請求太頻繁 (API 429 Error)，請稍等一分鐘後再試。");
                        }
                        throw error;
                    }
                    const delay = Math.pow(2, retries) * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    retries++;
                }
            }
        };

        // 正宗梅花易數時間起卦（農曆）：年支數+月+日 起上卦，加時辰數起下卦，總數取動爻。
        // 另加「問事字數」為外應數，使同一時辰之內不同問事可得不同卦（一事一卦，仍為決定性起卦、非亂數）。
        const calculateHexagram = (forceId = null, questionText = "") => {
            const now = new Date();
            let fullGanZhi = ""; let gregorianTime = "";
            let yearNum, monthNum, dayNum;
            const hourNum = getZhiIndexFromHour(now.getHours()) + 1; // 子1…亥12
            if (window.Solar && window.Lunar) {
                try {
                    let solarNow = window.Solar.fromDate(now);
                    if (now.getHours() >= 23) solarNow = solarNow.next(1); // 晚子時屬次日（倪師法）
                    const lunarNow = solarNow.getLunar();
                    fullGanZhi = `${lunarNow.getYearInGanZhi()}年 ${lunarNow.getMonthInGanZhi()}月 ${lunarNow.getDayInGanZhi()}日 ${lunarNow.getTimeInGanZhi()}時`;
                    gregorianTime = now.toLocaleString('zh-TW', { hour12: false, month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
                    yearNum = DI_ZHI.indexOf(lunarNow.getYearZhi()) + 1; // 子1…亥12
                    monthNum = Math.abs(lunarNow.getMonth());            // 閏月取本月數
                    dayNum = lunarNow.getDay();
                } catch(e) { console.error(e); }
            }
            if (yearNum === undefined) { yearNum = ((now.getFullYear() - 4) % 12 + 12) % 12 + 1; monthNum = now.getMonth() + 1; dayNum = now.getDate(); }
            const buildResult = (upperIdx, lowerIdx, movingLine, yingQi, method) => {
                const ben = hexFromTrigrams(upperIdx, lowerIdx);
                const benLines = [...TRIGRAM_LINES[lowerIdx], ...TRIGRAM_LINES[upperIdx]]; // 六爻由下而上
                const hu = hexFromTrigrams(linesToTrigram([benLines[2], benLines[3], benLines[4]]), linesToTrigram([benLines[1], benLines[2], benLines[3]]));
                let zhi = null;
                if (movingLine >= 1) {
                    const zhiLines = [...benLines]; zhiLines[movingLine - 1] = zhiLines[movingLine - 1] ? 0 : 1;
                    zhi = hexFromTrigrams(linesToTrigram([zhiLines[3], zhiLines[4], zhiLines[5]]), linesToTrigram([zhiLines[0], zhiLines[1], zhiLines[2]]));
                }
                const movingInLower = movingLine >= 1 && movingLine <= 3; // 動爻所在之卦為「用」，另一卦為「體」
                const tiIdx = movingInLower ? upperIdx : lowerIdx;
                const yongIdx = movingInLower ? lowerIdx : upperIdx;
                const tiElement = TRIGRAM_ELEMENT[tiIdx]; const yongElement = TRIGRAM_ELEMENT[yongIdx];
                return {
                    id: ben.id, ben: { upper: upperIdx, lower: lowerIdx, name: ben.name },
                    hu: { name: hu.name, id: hu.id },
                    zhi: zhi ? { name: zhi.name, id: zhi.id } : { name: "（無動爻）" },
                    movingLine, timestamp: now.toLocaleString('zh-TW', { hour12: false }),
                    tiYong: { tiIdx, yongIdx, tiPos: movingInLower ? "上" : "下", yongPos: movingInLower ? "下" : "上", tiName: TRIGRAM_NAME[tiIdx], yongName: TRIGRAM_NAME[yongIdx], tiElement, yongElement, judgement: tiYongJudge(tiElement, yongElement) },
                    yingQi, ganZhiTime: fullGanZhi, gregorianTime, method
                };
            };
            if (forceId) {
                let fu = 1, fl = 1;
                for (let u = 1; u <= 8; u++) for (let l = 1; l <= 8; l++) { if (HEX_MATRIX[u - 1][l - 1] === forceId) { fu = u; fl = l; } }
                return buildResult(fu, fl, 0, fu + fl, "指定卦");
            }
            const charCount = (questionText || "").replace(/\s/g, "").length;
            const upperSum = yearNum + monthNum + dayNum + charCount;
            const totalSum = upperSum + hourNum;
            const upperIdx = upperSum % 8 || 8;
            const lowerIdx = totalSum % 8 || 8;
            const movingLine = totalSum % 6 || 6;
            return buildResult(upperIdx, lowerIdx, movingLine, totalSum, charCount > 0 ? `農曆時間＋問事字數(${charCount})起卦` : "農曆時間起卦");
        };

                const Solar = window.Solar;

                if (hour >= 23) solar = solar.next(1); // 晚子時換日：過了夜間十一點即算次日（倪師法）

                if (!returnOnly) setCalendarData(bazi);

                let lunarMonth = lunar.getMonth(); const lunarDay = lunar.getDay();

                      <div className="bg-cyan-50 text-cyan-900 p-6 rounded-lg shadow-2xl border-4 border-cyan-600 max-w-md w-full relative animate-in fade-in zoom-in">

                                  <div className="font-bold text-cyan-800 mb-1 flex items-center gap-1"><BrainCircuit size={14}/> 體質分析</div>

                              </div>
                              <div className="flex gap-2">
                                  <div className="bg-white p-3 rounded border border-cyan-200 shadow-sm flex-1">

                                  <div className="font-bold text-cyan-800 mb-1 flex items-center gap-1"><CloudRain size={14}/> 日常飲食建議</div>
                                  <ul className="list-disc list-inside text-xs">{healthReport.dietTherapy.map((o,i)=><li key={i}>{o}</li>)}</ul>
                              </div>
                              <div className="bg-red-50 p-3 rounded border border-red-200 shadow-sm text-red-800">
                                  <div className="font-bold mb-1 flex items-center gap-1"><Skull size={14}/> 日常禁忌</div>
                                  <div className="text-xs">{healthReport.taboos}</div>
                              </div>
                          </div>
                      </div>
                  </div>
              )}
              <div className="bg-amber-900 text-yellow-100 p-3 shadow-lg border-b-4 border-yellow-600 shrink-0 flex justify-between items-center">
                 <div className="flex items-center gap-2"><Compass size={24} className="text-yellow-400" /><h1 className="text-lg font-bold tracking-widest">天紀·易卦神機 v25.02</h1></div>
                 <div className="flex items-center gap-2">
                     <button onClick={() => setIsSettingsOpen(true)} className={`flex items-center gap-1 px-2 py-1 rounded text-xs border transition-colors ${userApiKey ? 'bg-amber-800 text-yellow-200 border-yellow-600' : 'bg-red-600 text-white border-red-400 animate-pulse'}`}><KeyRound size={14}/> {userApiKey ? "設定" : "輸入Key"}</button>
                     <button onClick={() => setIsLibraryOpen(true)} className={`flex items-center gap-1 px-2 py-1 rounded text-xs border hover:bg-amber-700 transition-colors ${Object.keys(localImages).length > 0 ? 'bg-green-700 border-green-500 text-white' : 'bg-amber-800 border-yellow-600 text-yellow-200'}`}>{Object.keys(localImages).length > 0 ? <ShieldCheck size={14}/> : <Grid size={14}/>} {Object.keys(localImages).length > 0 ? `圖庫(${Object.keys(localImages).length})` : "圖庫管理員"}</button>

                     <button onClick={handleLocalSave} disabled={isSaving} className="flex items-center gap-1 bg-amber-800 px-2 py-1 rounded text-xs border border-yellow-600 hover:bg-amber-700 w-16 justify-center text-yellow-200">{isSaving ? <Loader2 size={14} className="animate-spin"/> : <Save size={14}/>}</button>
                 </div>
              </div>
              <div className="bg-white border-b border-stone-300 p-2 shrink-0 flex flex-wrap gap-2 justify-center text-sm items-center z-10">
                 {!isLunarLibLoaded && <span className="text-xs text-red-500 flex items-center gap-1"><Loader2 size={12} className="animate-spin"/> 正在載入萬年曆...</span>}
                 <div className="flex items-center gap-1 border-r border-stone-300 pr-2"><span className="font-bold text-amber-900">生辰(國曆)</span><input type="text" value={birthYear} onChange={e => /^\d*$/.test(e.target.value) && setBirthYear(e.target.value)} className="border-b border-stone-400 w-10 text-center bg-transparent" placeholder="1984"/><select value={birthMonth} onChange={e=>setBirthMonth(parseInt(e.target.value))} className="bg-transparent">{Array.from({length:12},(_,i)=><option key={i+1} value={i+1}>{i+1}</option>)}</select>月<select value={birthDay} onChange={e=>setBirthDay(parseInt(e.target.value))} className="bg-transparent">{Array.from({length:31},(_,i)=><option key={i+1} value={i+1}>{i+1}</option>)}</select>日<input type="time" value={birthTimeStr} onChange={e=>setBirthTimeStr(e.target.value)} className="bg-transparent w-20 ml-1" /><button onClick={()=>setGender(g=>g==='M'?'F':'M')} className="font-bold bg-stone-100 px-2 rounded border border-stone-300 ml-1 flex items-center gap-1">{gender==='M' ? <UserCheck size={12} className="text-blue-600"/> : <UserCheck size={12} className="text-red-600"/>} {gender==='M'?'乾造(男)':'坤造(女)'}</button></div>
                 <div className="flex items-center gap-1"><span className="font-bold text-red-800">流年</span><button onClick={() => adjustYear(-1)} className="p-1 hover:bg-stone-200 rounded-full text-red-600"><ChevronLeft size={14}/></button><input type="text" value={targetYear} onChange={e => /^\d*$/.test(e.target.value) && setTargetYear(e.target.value)} className="border-b border-red-300 w-12 text-center bg-red-50 font-bold text-red-700" /><button onClick={() => adjustYear(1)} className="p-1 hover:bg-stone-200 rounded-full text-red-600"><ChevronRight size={14}/></button></div>
                 <button onClick={() => calculateChart()} disabled={!isLunarLibLoaded} className="bg-red-800 text-white px-3 py-1 rounded font-bold hover:bg-red-900 ml-auto flex items-center gap-1 disabled:opacity-50"><RotateCcw size={12}/> 排盤</button>
              </div>
              <div className="flex-1 overflow-hidden flex flex-col lg:flex-row max-w-7xl mx-auto w-full">
                  <div className="w-full lg:w-[45%] p-2 overflow-y-auto bg-stone-100 flex flex-col items-center">
                       {chart ? (
                           <div className="bg-yellow-50 border-4 border-amber-900 p-1 shadow-2xl relative w-full max-w-[450px] aspect-square select-none">
                                {highlightedIndices.length === 4 && ( <svg className="absolute inset-0 w-full h-full z-20 pointer-events-none" viewBox="0 0 100 100" preserveAspectRatio="none"><defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0,0 L0,6 L6,3 z" fill="#92400e" /></marker></defs>{(() => { const gc = (idx) => ({ 5:{r:1,c:1}, 6:{r:1,c:2}, 7:{r:1,c:3}, 8:{r:1,c:4}, 4:{r:2,c:1}, 9:{r:2,c:4}, 3:{r:3,c:1}, 10:{r:3,c:4}, 2:{r:4,c:1}, 1:{r:4,c:2}, 0:{r:4,c:3}, 11:{r:4,c:4} }[idx]); const gp = (idx) => { const c = gc(idx); return c ? { x: (c.c-1)*25+12.5, y: (c.r-1)*25+12.5 } : null; }; const p0=gp(highlightedIndices[0]), p1=gp(highlightedIndices[1]), p2=gp(highlightedIndices[2]), p3=gp(highlightedIndices[3]); if(!p0||!p1||!p2||!p3) return null; return ( <React.Fragment><line x1={p0.x} y1={p0.y} x2={p1.x} y2={p1.y} stroke="#92400e" strokeWidth="1" opacity="0.6" /><path d={`M${p2.x},${p2.y} L${p1.x},${p1.y} L${p3.x},${p3.y} L${p0.x},${p0.y} Z`} fill="rgba(180, 83, 9, 0.05)" stroke="#b45309" strokeWidth="0.5" strokeDasharray="3,2" /></React.Fragment> ); })()}</svg> )}
                                <div className="grid grid-cols-4 h-full bg-stone-300 gap-[1px] border border-amber-900" style={{ gridTemplateRows: 'repeat(4, 1fr)' }}>
                                    <div className="col-start-2 col-end-4 row-start-2 row-end-4 bg-white flex flex-col p-2 text-center relative border-[1px] border-amber-900">
                                        {calendarData && ( <div className="flex flex-col h-full justify-between py-2"><div className="flex justify-between items-center px-4 border-b border-stone-200 pb-1"><div className="text-xl font-black text-amber-900 flex items-center gap-1">{chart.userInfo.g === 'M' ? '乾造' : '坤造'}{chart.userInfo.g === 'M' ? <span className="text-xs bg-blue-100 text-blue-800 px-1 rounded">男命</span> : <span className="text-xs bg-red-100 text-red-800 px-1 rounded">女命</span>}</div><div className="flex flex-col items-end"><div className="text-sm font-bold text-stone-600">{chart.bureauInfo.name}</div><div className="text-[10px] text-stone-400">虛歲 {chart.userInfo.age}</div></div></div>{disasterFlags.length > 0 && ( <div className="mx-2 bg-red-100 border border-red-500 rounded p-1 text-[9px] text-red-800 font-bold animate-pulse text-left"><div className="flex items-center gap-1 mb-1 border-b border-red-300"><Skull size={10}/> 六親急災預警</div>{disasterFlags.map((f, i) => <div key={i}>• {f.msg}</div>)}</div> )}<div className="flex justify-around items-center px-2 font-serif"><div className="flex flex-col items-center"><span className="text-[10px] text-stone-400">年</span><span className="font-bold text-lg text-stone-800">{calendarData.yearGanZhi.charAt(0)}</span><span className="font-bold text-lg text-stone-800">{calendarData.yearGanZhi.charAt(1)}</span></div><div className="flex flex-col items-center"><span className="text-[10px] text-stone-400">月</span><span className="font-bold text-lg text-stone-800">{calendarData.monthGanZhi.charAt(0)}</span><span className="font-bold text-lg text-stone-800">{calendarData.monthGanZhi.charAt(1)}</span></div><div className="flex flex-col items-center"><span className="text-[10px] text-stone-400">日</span><span className="font-bold text-lg text-stone-800">{calendarData.dayGanZhi.charAt(0)}</span><span className="font-bold text-lg text-stone-800">{calendarData.dayGanZhi.charAt(1)}</span></div><div className="flex flex-col items-center"><span className="text-[10px] text-stone-400">時</span><span className="font-bold text-lg text-stone-800">{calendarData.timeGanZhi.charAt(0)}</span><span className="font-bold text-lg text-stone-800">{calendarData.timeGanZhi.charAt(1)}</span></div></div><div className="mt-1 text-xs bg-green-50 text-green-800 py-1 rounded border border-green-200 font-bold flex justify-center gap-2"><span className="text-green-900"><CalendarDays size={10} className="inline mr-1"/>流年 {chart.liunian.year}</span><span>|</span><span>主 {chart.liunian.palaceName}</span></div></div> )}
                                    </div>
                                    {gridConfig.map((cell) => { const p = chart.palaces[cell.idx]; const isSelf = highlightedIndices[0] === cell.idx; const isRelated = highlightedIndices.includes(cell.idx); return ( <div key={cell.idx} onClick={() => handlePalaceClick(cell.idx)} className={`relative flex flex-col justify-between cursor-pointer hover:bg-yellow-100 transition-colors ${isSelf ? 'bg-red-50 ring-2 ring-red-600 z-10' : isRelated ? 'bg-amber-50' : 'bg-white'}`} style={{ gridColumnStart: cell.c, gridRowStart: cell.r }}><div className="flex justify-between items-start px-1 pt-1"><div className={`text-[8px] px-1 rounded-sm font-bold ${p.id===chart.currentDayunIdx?'bg-blue-700 text-white':'bg-stone-200 text-stone-500'}`}>{p.dayun}</div>{p.isLiuNian && <div className="text-[8px] bg-green-600 text-white px-1 rounded-sm">流年</div>}</div><div className="flex flex-row-reverse flex-wrap items-start pr-1 gap-x-[1px] h-full overflow-hidden">{p.stars.map((s,i)=><div key={i} className={`text-[9px] font-bold ${s.color} writing-vertical-lr leading-none`}>{s.name}{s.hua && <span className="text-red-500 font-black">{s.hua}</span>}{s.liuHua && <span className="text-green-600 font-black">⟲{s.liuHua}</span>}</div>)}</div><div className="flex justify-between items-end border-t border-stone-100 pt-0.5 px-1 pb-0.5"><div className="text-xs font-black text-stone-800">{p.zhi}</div><div className={`font-bold text-[9px] ${p.isMing?'text-red-700':'text-stone-600'}`}>{p.name}</div></div></div> ); })}
                                </div>
                           </div>
                       ) : <div className="h-64 flex flex-col items-center justify-center text-stone-400 bg-white w-full border border-dashed border-stone-300 gap-2"><Loader2 className="animate-spin text-amber-800"/><span className="text-xs">等待萬年曆初始化...</span></div>}
                  </div>
                  <div className="w-full lg:w-[55%] flex flex-col h-[500px] lg:h-auto bg-white border-l border-amber-900 shadow-inner relative">
                      <div className="bg-yellow-50 p-2 border-b border-yellow-200 flex items-center justify-between shrink-0">
                          <div className="flex items-center gap-2 font-bold text-amber-900 text-sm"><MessageCircle size={16}/> 小助理迷天紀</div>
                          <div className="flex items-center gap-2">
                             {activeHexagramInfo && ( <button onClick={() => setIsImageModalOpen(true)} className="flex items-center gap-1 bg-amber-200 text-amber-900 px-2 py-1 rounded text-xs hover:bg-amber-300 font-bold shadow-sm"><Maximize2 size={12}/> <span>觀看原圖</span></button> )}
                             <button onClick={handleFengShui} disabled={isLoading} className="flex items-center gap-1 bg-emerald-100 text-emerald-800 px-2 py-1 rounded-full border border-emerald-300 hover:bg-emerald-200 text-xs shadow-sm"><Sparkles size={12}/> <span>陽宅佈局</span></button>
                             <button onClick={handleHealthReport} disabled={isHealthLoading} className="flex items-center gap-1 bg-cyan-100 text-cyan-800 px-2 py-1 rounded-full border border-cyan-300 hover:bg-cyan-200 text-xs shadow-sm">{isHealthLoading ? <Loader2 size={12} className="animate-spin"/> : <Sparkles size={12}/>} <span>疾厄食療</span></button>
                             <button onClick={handleLuckyCharm} disabled={isCharmLoading} className="flex items-center gap-1 bg-red-100 text-red-800 px-2 py-1 rounded-full border border-red-300 hover:bg-red-200 text-xs shadow-sm">{isCharmLoading ? <Loader2 size={12} className="animate-spin"/> : <Scroll size={12}/>} <span>流年錦囊</span></button>
                          </div>
                      </div>
                      <div ref={chatEndRef} className="flex-1 overflow-y-auto p-3 space-y-4 bg-stone-50">
                          {chatHistory.map((msg, idx) => (
                              <div key={idx} className={`flex flex-col ${msg.type === 'user' ? 'items-end' : 'items-start'}`}>
                                  <div className={`max-w-[95%] p-3 rounded-lg text-sm leading-6 shadow-sm relative ${msg.type === 'user' ? 'bg-amber-900 text-yellow-50 rounded-tr-none' : 'bg-white border border-stone-200 text-stone-800 rounded-tl-none'}`}>
                                      <div className={`text-[10px] mb-1 font-bold flex items-center gap-2 ${msg.type==='user'?'text-yellow-300 justify-end':'text-red-800 justify-between'}`}>{msg.type === 'bot' ? <span className="flex items-center gap-1">天紀 {msg.year && <span className="text-stone-400 font-normal">| {msg.year} {msg.ganZhi}</span>} {msg.inquiryTime && <span className="text-stone-500 font-normal ml-1 bg-stone-100 px-1 rounded flex items-center" title={`問事時間：${msg.inquiryTime.gregorian}`}><Hourglass size={8} className="mr-0.5"/>問於: {msg.inquiryTime.ganZhi.split(' ')[0]}..</span>}{msg.isFollowUp && <span className="bg-blue-100 text-blue-700 px-1 rounded border border-blue-200 text-[9px]">追問解析</span>}<span className="text-[8px] bg-purple-50 text-purple-700 px-1 rounded border border-purple-100 flex items-center gap-0.5" title="太歲干涉+性別校正"><Orbit size={8}/> 乾坤太歲</span>{msg.needsInteraction && <span className="text-[8px] bg-green-50 text-green-700 px-1 rounded border border-green-100 flex items-center gap-0.5"><MessageSquare size={8}/> 請求驗證</span>}</span> : <span className="opacity-80">問 {msg.year} {msg.isFollowUp && "(追問)"}</span>}
                                          {msg.type === 'bot' && <button onClick={() => playTTS(msg.text, idx)} disabled={audioState.isLoading} className="text-amber-700 bg-amber-100 px-1.5 rounded-full hover:bg-amber-200">{audioState.msgIndex===idx && audioState.isPlaying ? <Volume2 size={12} className="text-red-600 animate-pulse"/> : <Volume2 size={12}/>}</button>}
                                      </div>
                                      <div className="whitespace-pre-wrap">{msg.text}</div>
                                      {msg.divination && ( <div className="mt-2 flex gap-2"><button onClick={() => setIsImageModalOpen(true)} className="text-[10px] flex items-center gap-1 text-blue-600 hover:underline bg-blue-50 px-2 py-1 rounded"><ImageIcon size={12}/> 點此查看【{msg.divination.ben.name}】原圖</button></div> )}
                                      {msg.type === 'bot' && msg.needsInteraction && !chatHistory[idx + 1] && ( <div className="mt-3 bg-green-50 border border-green-200 p-2 rounded-lg animate-in slide-in-from-top-2"><div className="text-xs font-bold text-green-800 mb-1 flex items-center gap-1"><CheckSquare size={12}/> 請回饋事實，以利定盤：</div><div className="flex gap-2"><input type="text" placeholder="例如：是，去年八月確實發生過..." className="flex-1 text-xs border border-green-300 rounded px-2 py-1 focus:outline-none focus:border-green-500" value={interactiveInput} onChange={(e) => setInteractiveInput(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleInteractiveSubmit(interactiveInput, idx)} /><button onClick={() => handleInteractiveSubmit(interactiveInput, idx)} className="bg-green-600 text-white text-xs px-3 py-1 rounded hover:bg-green-700 transition-colors">確認</button></div></div> )}
                                  </div>
                              </div>
                          ))}
                          {isLoading && <div className="flex justify-center"><Loader2 className="animate-spin text-amber-800"/></div>}
                      </div>
                      <div className="bg-white border-t border-stone-200 p-2 shrink-0 space-y-2">
                          {chart ? (
                              <React.Fragment>
                                <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">{['今年運勢','大運分析','事業升遷','投資財運','感情婚姻'].map(t => ( <button key={t} onClick={()=>handleSendText(t)} className="shrink-0 px-3 py-1 text-xs font-bold rounded-full border bg-stone-50 text-stone-600 hover:bg-amber-100 hover:border-amber-500 hover:text-amber-900 transition-colors">{t}</button> ))}</div>
                                <div className="flex gap-2 items-center"><button onClick={() => setIsFollowUpMode(!isFollowUpMode)} className={`flex items-center gap-1 px-3 py-2 rounded-full text-xs font-bold transition-colors border ${isFollowUpMode ? 'bg-amber-100 text-amber-900 border-amber-400' : 'bg-stone-100 text-stone-400 border-stone-300'}`} title={isFollowUpMode ? "追問模式：鎖定當前卦象" : "一般模式：每次重新起卦"}>{isFollowUpMode ? <Lock size={12} className="text-red-600"/> : <Unlock size={12}/>}{isFollowUpMode ? "鎖定此卦" : "一事不二卜"}</button><input type="text" value={inputText} onChange={e=>setInputText(e.target.value)} onKeyDown={e=>e.key==='Enter'&&handleSendText()} placeholder={isFollowUpMode ? "請針對此卦繼續追問..." : "輸入問題，起卦顯影..."} className="flex-1 border border-stone-300 rounded-full px-4 py-2 text-sm focus:border-amber-700 outline-none bg-stone-50"/><button onClick={()=>handleSendText()} className="bg-red-800 text-white p-2 rounded-full shadow hover:bg-red-900" disabled={isLoading}><Send size={16}/></button></div>
                              </React.Fragment>
                          ) : <div className="text-center text-xs text-stone-400">請先排盤</div>}
                      </div>
                  </div>
              </div>
            </div>
          );
        }
        const root = createRoot(document.getElementById('root'));
        root.render(<ZiweiYiDivine />);
    </script>
