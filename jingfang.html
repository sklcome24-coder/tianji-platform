<script>
/* 知識庫連線自動切換：本機 RAG 優先，連不上改走雲端隧道（讀 backend.json） */
(function(){
  var LOCAL = 'http://127.0.0.1:8765';
  var _fetch = window.fetch.bind(window);
  var base = LOCAL;
  var ready = new Promise(function(done){
    var ac = ('AbortController' in window) ? new AbortController() : null;
    var t = setTimeout(function(){ if(ac) ac.abort(); }, 1500);
    _fetch(LOCAL + '/health', ac ? {signal: ac.signal} : {})
      .then(function(r){ return r.json(); })
      .then(function(d){ clearTimeout(t); if(d && d.ok){ done(); } else { throw 0; } })
      .catch(function(){
        clearTimeout(t);
        _fetch('backend.json?t=' + Date.now())
          .then(function(r){ return r.json(); })
          .then(function(j){ if(j && j.api) base = j.api; done(); })
          .catch(function(){ done(); });
      });
  });
  window.fetch = function(u, o){
    if (typeof u === 'string' && u.indexOf(LOCAL) === 0){
      return ready.then(function(){ return _fetch(base + u.slice(LOCAL.length), o); });
    }
    return _fetch(u, o);
  };
  window.__NI_BACKEND_READY__ = ready.then(function(){ return base; });
})();
</script>

    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js';
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, updateDoc, deleteDoc } from 'https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js';
        
        window.firebaseModules = { initializeApp, getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp, doc, updateDoc, deleteDoc };
        
        if (typeof __firebase_config !== 'undefined') {
            try {
                const app = initializeApp(JSON.parse(__firebase_config));
                window.auth = getAuth(app);
                window.db = getFirestore(app);
                
                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await signInWithCustomToken(window.auth, __initial_auth_token);
                    } else {
                        await signInAnonymously(window.auth);
                    }
                };
                initAuth();
                
                onAuthStateChanged(window.auth, u => { 
                    if(u) { window.userId = u.uid; }
                });
            } catch(e){ console.error("Firebase Init Error", e); }
        }
    </script>

    <script>
        // ============================================
        // 【使用者設定區】請在此固化 API KEY
        // ============================================
        
        // 請將您的 Google Gemini API Key 填入下方的引號中
        const FIXED_API_KEY = ""; 
        
        // ============================================

        // --- 變數 ---
        let userApiKey = "";
        let imgData = { tongue: null, face: null, sleep: null, hr: null, hrv: null, spo2: null };
        let chatHistory = [];
        let currentRecordId = null; 
        let initialContext = "";

        const questionsBase = [
            { id: 'q1', text: '一、睡眠 (Sleep)', options: ['一覺到天亮', '入睡困難 (心)', '半夜醒 (肝/肺)', '嗜睡 (少陰)'] },
            { id: 'q2', text: '二、胃口 (Appetite)', options: ['正常', '食慾過旺 (熱)', '無食慾 (寒/虛)', '噁心 (水飲)'] },
            { id: 'q3', text: '三、口渴 (Thirst)', options: ['不渴', '喜冷飲', '喜熱飲', '渴不欲飲'] },
            { id: 'q4', text: '四、大便 (Stool)', options: ['每日正常', '便秘 (無痛)', '便秘 (腹痛)', '下利 (拉肚)'] },
            { id: 'q5', text: '五、小便 (Urine)', options: ['淡黃', '深黃 (熱)', '清白 (寒)', '頻尿/痛'] },
            { id: 'q6', text: '六、手腳 (Limbs)', options: ['溫熱', '冰冷', '手熱足冷', '煩熱'] },
            { id: 'q7', text: '七、流汗 (Sweat)', options: ['正常', '無汗 (表實)', '自汗 (表虛)', '盜汗 (陰虛)'] },
            { id: 'q8', text: '八、寒熱 (Temp)', options: ['正常', '怕冷', '怕熱', '忽冷忽熱'] },
            { id: 'q9', text: '九、身痛/體力', options: ['正常', '身痛/骨節痛', '易疲倦', '麻木'] },
            { id: 'q10', text: '十、生理/其他', options: ['正常', '異常 (痛經/陽痿)', '無'] }
        ];

        // --- API 重試機制 (防禦 429 錯誤) ---
        const fetchWithRetry = async (url, options, maxRetries = 5) => {
            let retries = 0;
            while (retries <= maxRetries) {
                try {
                    const response = await fetch(url, options);
                    if (!response.ok) {
                        const err = new Error(`API Error: ${response.status}`);
                        err.status = response.status;
                        throw err;
                    }
                    return response;
                } catch (error) {
                    // 若是因逾時(Abort)主動中止，直接丟出不重試
                    if (error.name === 'AbortError') {
                        throw error;
                    }
                    // 若是 400 格式錯誤、403 金鑰錯誤、404 找不到模型，直接報錯不重試
                    if (error.status && [400, 403, 404].includes(error.status)) {
                        throw error;
                    }
                    if (retries >= maxRetries) {
                        if (error.status === 429) {
                            throw new Error("請求太頻繁 (API 429 Error)，請稍等一分鐘後再試。");
                        }
                        throw error;
                    }
                    const delay = Math.pow(2, retries) * 1000;
                    await new Promise(resolve => setTimeout(resolve, delay));
                    retries++;
                }
            }
        };

        // --- 初始化 ---
        window.addEventListener('load', () => {
            const container = document.getElementById('questions-container');
            container.innerHTML = questionsBase.map(q => {
                const finalOptions = [...q.options, '以上皆非 (詳見自述)'];
                return `
                <div class="border-b border-gray-100 pb-4 last:border-0">
                    <div class="font-bold text-[#78350f] text-sm mb-3">${q.text}</div>
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-2 mb-3">
                        ${finalOptions.map((opt, i) => {
                            const isOther = opt.includes('以上皆非');
                            return `
                            <label class="radio-label ${isOther ? 'radio-label-other' : ''}">
                                <input type="radio" name="${q.id}" value="${opt}" class="hidden" ${i===0?'checked':''}>
                                <span class="text-xs ${isOther ? 'text-gray-500' : 'text-gray-700'} w-full">${opt}</span>
                            </label>
                        `}).join('')}
                    </div>
                    <input type="text" id="detail-${q.id}" class="note-input" placeholder="✎ 補充/自述細節...">
                </div>
            `}).join('');

            if(FIXED_API_KEY && FIXED_API_KEY.length > 10) {
                userApiKey = FIXED_API_KEY;
                updateApiStatus(true);
                document.getElementById('fixed-key-msg').classList.remove('hidden');
                document.getElementById('custom-api-key').value = "(已使用程式碼內建金鑰)";
                document.getElementById('custom-api-key').disabled = true;
            } else {
                const savedKey = localStorage.getItem('gemini_api_key');
                if(savedKey) { 
                    userApiKey = savedKey; 
                    document.getElementById('custom-api-key').value = savedKey; 
                    updateApiStatus(true); 
                } else { 
                    const apiKey = ""; 
                    if(apiKey) { userApiKey = apiKey; updateApiStatus(true); } 
                    else { updateApiStatus(false); }
                }
            }
        });

        function updateApiStatus(connected) {
            const badge = document.getElementById('api-status-display');
            if(connected) { badge.innerHTML = '<i class="fa-solid fa-link"></i> API 已連線'; badge.classList.remove('inactive'); badge.classList.add('active'); } 
            else { badge.innerHTML = '<i class="fa-solid fa-link-slash"></i> 未連線'; badge.classList.remove('active'); badge.classList.add('inactive'); }
        }

        window.saveApiKey = (event) => {
            if(FIXED_API_KEY && FIXED_API_KEY.length > 10) {
                 document.getElementById('api-modal').classList.add('hidden');
                 return;
            }
            const k = document.getElementById('custom-api-key').value.trim();
            if(k) { 
                localStorage.setItem('gemini_api_key', k); 
                userApiKey = k; 
                updateApiStatus(true); 
                if(event && event.target) {
                    const btn = event.target;
                    const originalText = btn.innerText;
                    btn.innerText = "已儲存！";
                    btn.classList.add("bg-green-600");
                    setTimeout(() => {
                        document.getElementById('api-modal').classList.add('hidden');
                        btn.innerText = originalText;
                        btn.classList.remove("bg-green-600");
                    }, 1000);
                } else {
                    document.getElementById('api-modal').classList.add('hidden');
                }
            }
        };

        function compressImage(file, maxWidth = 800, quality = 0.6) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const img = new Image();
                    img.onload = () => {
                        let width = img.width;
                        let height = img.height;
                        if (width > maxWidth) {
                            height = Math.round(height * (maxWidth / width));
                            width = maxWidth;
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', quality));
                    };
                    img.onerror = reject;
                    img.src = e.target.result;
                };
                reader.onerror = reject;
                reader.readAsDataURL(file);
            });
        }

        window.previewImage = async (input, type) => { 
            if (input.files[0]) { 
                try {
                    const compressedDataUrl = await compressImage(input.files[0]);
                    setPreview(type, compressedDataUrl);
                } catch (e) {
                    console.error("Image compression failed", e);
                    alert("圖片處理失敗，請試著使用較小的圖片。");
                }
            } 
        };

        function setPreview(type, dataUrl) {
            const preview = document.getElementById(`${type}-preview`);
            const placeholder = document.getElementById(`${type}-placeholder`);
            const clearBtn = document.getElementById(`${type}-clear`);
            
            preview.src = dataUrl;
            preview.classList.remove('hidden');
            placeholder.classList.add('hidden');
            clearBtn.classList.remove('hidden');
            
            imgData[type] = dataUrl.split(',')[1];
        }

        window.clearImage = (type) => { 
            event.stopPropagation(); 
            document.getElementById(`${type}-preview`).classList.add('hidden'); 
            document.getElementById(`${type}-placeholder`).classList.remove('hidden'); 
            document.getElementById(`${type}-clear`).classList.add('hidden'); 
            document.getElementById(`${type}-image`).value = ''; 
            imgData[type] = null; 
        };
        
        window.openLightbox = (id) => { document.getElementById('lightbox-img').src = document.getElementById(id).src; document.getElementById('lightbox-modal').classList.remove('hidden'); };
        window.closeLightbox = () => document.getElementById('lightbox-modal').classList.add('hidden');

        // --- UI Toggle Functions ---
        window.toggleSection = (id) => {
            const el = document.getElementById(id);
            el.classList.toggle('hidden');
        };

        window.toggleResultSize = () => {
            const card = document.getElementById('result-card-container');
            const icon = document.getElementById('result-toggle-icon');
            if (card.style.maxHeight === '45%') {
                card.style.maxHeight = '85%';
                icon.classList.remove('fa-chevron-down');
                icon.classList.add('fa-chevron-up');
            } else {
                card.style.maxHeight = '45%';
                icon.classList.remove('fa-chevron-up');
                icon.classList.add('fa-chevron-down');
            }
        };

        // --- 核心邏輯：初始分析 ---
        window.startInitialAnalysis = async () => {
            const btn = document.getElementById('analyze-btn');
            const msg = document.getElementById('error-msg');
            
            let activeKey = userApiKey;
            if(FIXED_API_KEY && FIXED_API_KEY.length > 10) { activeKey = FIXED_API_KEY; }

            const envKey = ""; 
            if(!activeKey && !envKey) { document.getElementById('api-modal').classList.remove('hidden'); return; }
            
            msg.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<span class="loader"></span> 處理影像與資料中...';

            const gender = document.querySelector('input[name="gender"]:checked').value;
            const age = document.getElementById('age').value;
            const height = document.getElementById('height').value;
            const weight = document.getElementById('weight').value;
            const complaint = document.getElementById('main-complaint').value || "無";
            
            let qData = "";
            questionsBase.forEach(q => {
                const val = document.querySelector(`input[name="${q.id}"]:checked`).value;
                const detail = document.getElementById(`detail-${q.id}`).value;
                if (val.includes("以上皆非")) { qData += `【${q.text}】選項: [無效] | ★關鍵自述: "${detail || '未填寫'}"\n`; }
                else { qData += `【${q.text}】選項: ${val} ${detail ? '| 自述: '+detail : ''}\n`; }
            });

            initialContext = `病患：${gender}, ${age}歲, 身高${height}cm, 體重${weight}kg。主訴：${complaint}。問診資料：\n${qData}`;
            
            chatHistory = [];
            currentRecordId = Date.now().toString(); 
            document.getElementById('chat-box').innerHTML = '';
            document.getElementById('result-card-container').classList.add('hidden'); // 初始不顯示處方，因為要先問診
            document.getElementById('intro-state').classList.add('hidden');
            document.getElementById('interaction-area').classList.remove('hidden');
            document.getElementById('interaction-area').classList.add('flex');
            document.getElementById('user-note').value = ''; 

            btn.innerHTML = '<span class="loader"></span> 倪師望聞問切中...';
            await callAI(initialContext, true);
            
            btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-bolt"></i> 啟動二階段辨證';
        };

        // --- 核心邏輯：AI 呼叫 ---
        async function callAI(contextInput, isInitial = false) {
            updateChatStatus("倪師思考中...");
            
            let historyText = chatHistory.map(m => `${m.role === 'ni' ? '倪師' : '病患'}: ${m.text}`).join('\n');
            
            const systemPrompt = `
            你現在是漢唐中醫 **倪海廈 (Ni Haixia)** 院長。你的辨證風格與用藥邏輯必須**完全百分之百**遵照倪師的教學與《人紀》、《傷寒論》、《金匱要略》。

            【診斷流程 (Mandatory Two-Step Process)】：
            1.  **階段一：初步辨證與追問 (Inquiry Phase)**
                - **絕對不要直接開方**。
                - 結合望診 (圖片) 與初診資料，判斷可能的病機方向 (例如：「疑似少陽證」或「疑似太陰證」)。
                - 為了求證，**必須反問病患 3-5 個關鍵問題** (鑑別診斷)。例如：若懷疑少陽，需問口苦咽乾、忽冷忽熱；懷疑太陰，需問腹痛與大便。
                - 輸出 type: "inquiry"。
            
            2.  **階段二：確診與開方 (Diagnosis Phase)**
                - 只有當病患回答了上述追問後，才進行確診。
                - 輸出 type: "diagnosis" 並開出處方。

            【望診分析】：
            - **舌象**：觀察舌苔(寒熱)、舌質(虛實)、齒痕(濕)。
            - **面相 (新增)**：
              - 面色青(肝/痛/寒)、赤(心/熱)、黃(脾/濕)、白(肺/虛/寒)、黑(腎/痛/水)。
              - 眼神：有神(病輕)、無神(病重)。
              - 氣色：光澤(吉)、晦暗(凶)。

            【劑量法則】：
            - 必須參考病患的**身高體重**來決定劑量。
            - 體格壯實/體重過重者：麻黃、桂枝、附子、石膏等主藥劑量需加重。

            【輸出 JSON 格式 (嚴禁 Markdown)】：
            - **若是階段一 (追問)**：
              {
                  "type": "inquiry",
                  "ni_chat_reply": "【倪師望診初步分析】\n(請簡述對舌象/面相的觀察，例如：面色偏青，舌苔白膩...)\n\n【進一步追問】\n(請列出 3-5 個關鍵問題來確認病機，語氣要像倪師親自問診，例如：'這很重要，你早上起來嘴巴苦不苦？')"
              }
            
            - **若是階段二 (確診)**：
              {
                  "type": "diagnosis",
                  "diagnosis_data": { 
                      "stage": "六經", 
                      "bagang": "八綱",
                      "pathology": "病機",
                      "bone_formula": "經方主方名",
                      "bone_herbs": [ {"name":"藥名","dose":"劑量(錢/兩)"} ],
                      "modifications": [ {"name":"藥名","dose":"劑量","action":"加/減","reason":"理由"} ],
                      "reason": "方義解析",
                      "ni_comment": "倪師點評 (包含生活建議)"
                  },
                  "ni_chat_reply": "根據你的回答，這已經很明顯了，這是... (解釋為何確診此方)"
              }
            `;

            const fullPrompt = `${systemPrompt}\n\n【原始資料】\n${initialContext}\n\n【對話紀錄】\n${historyText}\n\n${isInitial ? '這是初診。請觀察舌象、面相與數據，並進行初步分析與「追問」(type: inquiry)。不要直接開方。' : '病患已回答，請根據他的回答進行確診 (type: diagnosis)。'}`;

            try {
                let keyToUse = (FIXED_API_KEY && FIXED_API_KEY.length > 10) ? FIXED_API_KEY : userApiKey;
                keyToUse = keyToUse ? keyToUse.trim() : "";
                
                if (!keyToUse) {
                    const envKey = ""; 
                    if(envKey) keyToUse = envKey;
                }

                if (!keyToUse) {
                    appendChatBubble('ni', "系統提示：請先點擊右上角「設定」，輸入您的 Google Gemini API Key 才能開始辨證。");
                    updateChatStatus("等待設定");
                    document.getElementById('api-modal').classList.remove('hidden');
                    const loadingBubble = document.getElementById('loading-bubble');
                    if(loadingBubble) loadingBubble.remove();
                    return;
                }

                const parts = [{ text: fullPrompt }];
                if(isInitial) {
                    for(let k in imgData) { 
                        if(imgData[k]) {
                            parts.push({ inlineData: { mimeType: "image/jpeg", data: imgData[k] } }); 
                        } 
                    }
                }

                // 改走本地 RAG 伺服器：限定倪海廈中醫新庫(domain=tcm) + gemini-3.5-flash
                const url = `http://127.0.0.1:8765/gemini?domain=tcm&key=${keyToUse}`;
                const body = JSON.stringify({ contents: [{ parts }], generationConfig: { responseMimeType: "application/json" } });

                const controller = new AbortController();
                const timeoutId = setTimeout(() => controller.abort(), 60000); 

                try {
                    // 使用 fetchWithRetry 防止 429 錯誤中斷
                    const res = await fetchWithRetry(url, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: body,
                        signal: controller.signal
                    });
                    clearTimeout(timeoutId);

                    const json = await res.json();
                    
                    if (json.error) {
                        throw new Error(json.error.message);
                    }
                    
                    let raw = json.candidates[0].content.parts[0].text;
                    raw = raw.replace(/```json/g, '').replace(/```/g, '').trim();
                    const result = JSON.parse(raw);
                    handleAIResponse(result);

                } catch (fetchError) {
                    clearTimeout(timeoutId);
                    throw fetchError;
                }

            } catch(e) {
                console.error(e);
                const loadingBubble = document.getElementById('loading-bubble');
                if(loadingBubble) loadingBubble.remove();
                
                let errorMsg = "系統提示：" + e.message;
                
                if (e.name === 'AbortError') {
                    errorMsg = "連線逾時。請減少圖片數量或檢查網路。";
                } else if (e.message.includes("API key")) {
                    errorMsg = "API Key 無效。請檢查您的金鑰。";
                }
                
                appendChatBubble('ni', errorMsg);
                updateChatStatus("連線中斷");
            }
        }

        function handleAIResponse(res) {
            updateChatStatus("等待輸入");
            
            const loadingBubble = document.getElementById('loading-bubble');
            if(loadingBubble) loadingBubble.remove();
            
            if (res.type === 'inquiry') {
                // 階段一：隱藏處方卡，顯示追問
                document.getElementById('result-card-container').classList.add('hidden');
                appendChatBubble('ni', res.ni_chat_reply);
                // 可以自動聚焦輸入框
                document.getElementById('chat-input').focus();
            } else if (res.type === 'diagnosis') {
                // 階段二：顯示處方
                renderDiagnosis(res.diagnosis_data);
                document.getElementById('result-card-container').classList.remove('hidden');
                
                if (res.ni_chat_reply && res.ni_chat_reply.trim() !== "") {
                    appendChatBubble('ni', res.ni_chat_reply);
                }
                
                saveRecord(res.diagnosis_data);
            }
        }

        // --- 聊天功能 ---
        function appendChatBubble(role, text) {
            const box = document.getElementById('chat-box');
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${role === 'ni' ? 'chat-ni' : 'chat-user'}`;
            bubble.innerHTML = text.replace(/\n/g, '<br>');
            box.appendChild(bubble);
            box.scrollTop = box.scrollHeight;
            if(role !== 'loading') { chatHistory.push({ role, text }); }
            return bubble;
        }

        function showLoadingBubble() {
            const box = document.getElementById('chat-box');
            const bubble = document.createElement('div');
            bubble.id = 'loading-bubble';
            bubble.className = 'chat-bubble chat-ni flex items-center gap-1';
            bubble.innerHTML = '<span class="text-xs text-gray-400 font-bold mr-1">倪師思考中</span><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span>';
            box.appendChild(bubble);
            box.scrollTop = box.scrollHeight;
        }

        function handleEnter(e) { if(e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChatMessage(); } }

        function sendChatMessage() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if(!text) return;
            appendChatBubble('user', text);
            input.value = '';
            showLoadingBubble();
            callAI("", false); 
        }

        function updateChatStatus(status) { document.getElementById('chat-status').innerText = status; }

        function renderDiagnosis(data) {
            document.getElementById('diagnosis-stage').innerText = data.stage;
            document.getElementById('pathology').innerText = data.pathology;
            document.getElementById('bagang-details').innerText = data.bagang;
            document.getElementById('rx-name').innerText = data.bone_formula;
            document.getElementById('herb-bone-list').innerHTML = data.bone_herbs.map(h => `<div class="flex justify-between border-b border-gray-100 pb-1"><span class="font-bold text-[#78350f]">${h.name}</span><span class="font-mono text-gray-600">${h.dose}</span></div>`).join('');
            if(data.modifications && data.modifications.length > 0) {
                 const modHTML = data.modifications.map(m => `<div class="flex justify-between border-b border-dashed border-gray-200 pb-1 ${m.action==='加'?'text-green-700':'text-red-700'}"><span class="font-bold text-xs"><i class="fa-solid ${m.action==='加'?'fa-plus':'fa-minus'}"></i> ${m.name}</span><span class="font-mono text-xs">${m.dose}</span></div>`).join('');
                document.getElementById('herb-bone-list').innerHTML += modHTML;
            }
            document.getElementById('rx-reason').innerText = data.reason;
            document.getElementById('ni-comment').innerText = data.ni_comment;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.innerText = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function saveUserNote() {
            const note = document.getElementById('user-note').value;
            if(!currentRecordId) return;
            
            try {
                const localHistory = JSON.parse(localStorage.getItem('ni_tcm_records') || '[]');
                const idx = localHistory.findIndex(r => r.id == currentRecordId || r.timestamp == currentRecordId); 
                
                if (idx !== -1) {
                    localHistory[idx].userNote = note;
                    localStorage.setItem('ni_tcm_records', JSON.stringify(localHistory));
                    showToast("備註已保存");
                }
            } catch(e) { console.error(e); showToast("保存失敗"); }
        }

        async function saveRecord(diagnosisData) {
            const record = {
                id: currentRecordId || Date.now().toString(),
                timestamp: new Date().toISOString(),
                diagnosis: diagnosisData.stage,
                formula: diagnosisData.bone_formula,
                fullResult: diagnosisData,
                chatLog: chatHistory,
                userNote: document.getElementById('user-note').value || "",
                images: { ...imgData },
                source: 'local'
            };
            
            try {
                const localHistory = JSON.parse(localStorage.getItem('ni_tcm_records') || '[]');
                const existingIdx = localHistory.findIndex(r => r.id == record.id);
                
                if (existingIdx !== -1) {
                    localHistory[existingIdx] = record;
                } else {
                    localHistory.unshift(record);
                    if(localHistory.length > 30) localHistory.pop();
                }

                try {
                    localStorage.setItem('ni_tcm_records', JSON.stringify(localHistory));
                    showToast("已自動儲存至本地病歷 (含圖片)");
                } catch (quotaError) {
                    console.warn("Storage Quota Exceeded. Removing images to save text data.");
                    record.images = {}; 
                    if (existingIdx !== -1) localHistory[existingIdx] = record;
                    else localHistory[0] = record;
                    
                    localStorage.setItem('ni_tcm_records', JSON.stringify(localHistory));
                    showToast("空間不足，僅儲存文字病歷");
                }

            } catch(e) {
                console.error("Local Storage Save Failed", e);
                showToast("本地儲存失敗");
            }

            if(window.db && window.userId) {
                try {
                    const appId = (typeof __app_id !== 'undefined') ? __app_id : 'ni-tcm-v64-local';
                    const colRef = window.firebaseModules.collection(window.db, 'artifacts', appId, 'users', window.userId, 'records');
                    
                    const cloudRecord = { 
                        ...record, 
                        timestamp: window.firebaseModules.serverTimestamp(), 
                        source: 'cloud',
                        images: {} 
                    };

                    if (currentRecordId) {
                         await window.firebaseModules.addDoc(colRef, cloudRecord);
                    }
                    console.log("Cloud Backup Success");
                } catch(e) { console.error("Cloud Save Error (Ignore if offline)", e); }
            }
        }

        window.deleteLocalRecord = (event, id) => {
            if(event) event.stopPropagation();
            if(!confirm("【注意】您確定要永久刪除這筆病歷嗎？")) return;
            
            try {
                let localHistory = JSON.parse(localStorage.getItem('ni_tcm_records') || '[]');
                const originalLen = localHistory.length;
                const newHistory = localHistory.filter(r => r.id != id && r.timestamp != id);
                
                if(newHistory.length === originalLen) {
                    alert("刪除失敗：找不到對應的 ID");
                    return;
                }

                localStorage.setItem('ni_tcm_records', JSON.stringify(newHistory));
                toggleHistory();
                showToast("病歷已成功刪除");
            } catch(e) {
                console.error(e);
                alert("刪除時發生錯誤：" + e.message);
            }
        };

        window.loadLocalRecord = (id) => {
             const localData = JSON.parse(localStorage.getItem('ni_tcm_records') || '[]');
             const record = localData.find(r => r.id == id || r.timestamp == id); 
             if(record) {
                 displayHistory(record);
             } else {
                 alert("讀取失敗：找不到病歷資料");
             }
        };

        window.displayHistory = (d) => {
            currentRecordId = d.id;
            
            if(d.fullResult) renderDiagnosis(d.fullResult);
            
            if (d.images) {
                imgData = d.images;
                for(let type in d.images) {
                    if(d.images[type]) {
                        setPreview(type, `data:image/jpeg;base64,${d.images[type]}`);
                    } else {
                         document.getElementById(`${type}-preview`).classList.add('hidden'); 
                         document.getElementById(`${type}-placeholder`).classList.remove('hidden'); 
                         document.getElementById(`${type}-clear`).classList.add('hidden');
                    }
                }
            }

            document.getElementById('user-note').value = d.userNote || "";

            document.getElementById('intro-state').classList.add('hidden');
            document.getElementById('interaction-area').classList.remove('hidden');
            document.getElementById('interaction-area').classList.add('flex');
            // 若為 Inquiry 狀態，歷史紀錄應該顯示最後的狀態，若已經是診斷結果則顯示卡片
            if(d.fullResult) document.getElementById('result-card-container').classList.remove('hidden');
            else document.getElementById('result-card-container').classList.add('hidden');

            const box = document.getElementById('chat-box');
            box.innerHTML = '';
            if(d.chatLog) { d.chatLog.forEach(m => appendChatBubble(m.role, m.text)); }
            
            const drawer = document.getElementById('history-drawer');
            const overlay = document.getElementById('drawer-overlay');
            drawer.classList.add('translate-x-full');
            overlay.classList.add('hidden');
        };

        window.toggleHistory = () => { 
            const d=document.getElementById('history-drawer'); 
            const o=document.getElementById('drawer-overlay'); 
            const l=document.getElementById('history-list'); 
            
            if(d.classList.contains('translate-x-full')){ 
                d.classList.remove('translate-x-full'); 
                o.classList.remove('hidden'); 
                
                let html = '';
                try {
                    const localData = JSON.parse(localStorage.getItem('ni_tcm_records') || '[]');
                    if(localData.length > 0) {
                        html += `<div class="px-2 py-1 text-xs font-bold text-gray-500 bg-gray-200">本地存儲 (含圖片)</div>`;
                        html += localData.map((data) => {
                            const dateStr = new Date(data.timestamp).toLocaleString();
                            const safeId = data.id || data.timestamp;
                            
                            return `
                            <div class="history-item bg-white p-3 rounded border-l-4 border-green-600 shadow-sm mb-2 mx-2 relative group hover:bg-green-50 transition-colors">
                                <div class="cursor-pointer" onclick="window.loadLocalRecord('${safeId}')">
                                    <div class="font-bold text-sm text-gray-800">${data.formula || '未完成診斷 (問診中)'}</div>
                                    <div class="text-xs text-gray-500">${dateStr}</div>
                                </div>
                                <button onclick="window.deleteLocalRecord(event, '${safeId}')" class="delete-btn absolute top-2 right-2 text-gray-400 p-2 rounded-full cursor-pointer" title="刪除此紀錄">
                                    <i class="fa-solid fa-trash-can text-lg"></i>
                                </button>
                            </div>`;
                        }).join('');
                    }
                } catch(e) { console.error("Read Local Error", e); }

                if(html === '') html = '<div class="p-4 text-center text-xs text-gray-500">尚無本地紀錄</div>';
                l.innerHTML = html;

            } else { d.classList.add('translate-x-full'); o.classList.add('hidden'); } 
        };

    </script>
